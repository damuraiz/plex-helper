# Installed/removed by DSM's web-config resource worker. No global edits.
location = /webman/3rdparty/plex-helper {
    return 302 /webman/3rdparty/plex-helper/;
}
location ^~ /webman/3rdparty/plex-helper/ {
    proxy_pass http://127.0.0.1:8650/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Plex-Helper-Client-IP $remote_addr;
    proxy_set_header X-Plex-Helper-Server-IP $server_addr;
    proxy_set_header X-Plex-Helper-Server-Port $server_port;
    proxy_set_header X-Plex-Helper-Protocol $scheme;
    client_max_body_size 4m;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
