<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Plex Helper</title></head>
<body><p><a id="launch">Open Plex Helper</a></p>
<p>Default: HTTP port 8650. If you configured HTTPS or a reverse proxy, use its URL.</p>
<script>
// Keep the NAS hostname used for DSM. The service has its own login, not DSM SSO.
const destination = new URL(location.href);
destination.protocol = 'http:';
destination.port = '8650';
destination.pathname = '/';
destination.search = '';
destination.hash = '';
document.getElementById('launch').href = destination.href;
location.replace(destination.href);
</script></body></html>
