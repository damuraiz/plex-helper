name: Test and build Synology package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      SOURCE_DATE_EPOCH: '1791936000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -race ./...
      - run: python3 scripts/test-package.py
      - run: python3 scripts/build-spk.py
      - uses: actions/upload-artifact@v4
        with:
          name: plex-helper-synology-x86_64
          path: dist/*.spk*
